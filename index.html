<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DQTV — Bảng điều khiển (Vercel)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent1:  #3b82f6;
      --accent2:  #10b981;
      --accent3:  #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 44px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent1), #6366f1);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* ── Host switcher: dq.dishow.net / dqtt.dishow.net ──────── */
    .host-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .host-pill {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
      user-select: none;
    }
    .host-pill:hover { border-color: var(--accent2); color: var(--text); }
    .host-pill.active {
      color: var(--accent2);
      background: color-mix(in srgb, var(--accent2) 12%, transparent);
      border-color: var(--accent2);
    }

    .status-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 44px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .status-pill:hover { border-color: var(--accent1); color: var(--text); }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .4s;
    }
    .dot.online  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.loading { background: var(--accent3); animation: pulse 1s infinite; }
    .dot.error   { background: #ef4444; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 980px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px #0008; }
    .card:hover::before { opacity: 1; }
    .card:active { transform: translateY(0); }

    .card-1 { --c: var(--accent1); }
    .card-1::before { background: linear-gradient(135deg, #3b82f608, transparent 60%); }
    .card-1:hover { border-color: var(--accent1); }

    .card-2 { --c: var(--accent2); }
    .card-2::before { background: linear-gradient(135deg, #10b98108, transparent 60%); }
    .card-2:hover { border-color: var(--accent2); }

    .card-3 { --c: var(--accent3); }
    .card-3::before { background: linear-gradient(135deg, #f59e0b08, transparent 60%); }
    .card-3:hover { border-color: var(--accent3); }

    .card-4 { --c: #a78bfa; }
    .card-4::before { background: linear-gradient(135deg, #a78bfa08, transparent 60%); }
    .card-4:hover { border-color: #a78bfa; }

    .card-5 { --c: #10b981; }
    .card-5::before { background: linear-gradient(135deg, #10b98108, transparent 60%); }
    .card-5:hover { border-color: #10b981; }

    .card-icon {
      width: 46px; height: 46px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--c) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 1.08rem;
      font-weight: 600;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .port-badge {
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      color: var(--c);
      background: color-mix(in srgb, var(--c) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
      padding: 3px 9px;
      border-radius: 6px;
    }
    .arrow {
      color: var(--muted);
      font-size: 1rem;
      transition: color .2s, transform .2s;
    }
    .card:hover .arrow { color: var(--c); transform: translateX(3px); }

    footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.7;
    }
    footer span { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🎖</div>
      <div>
        <h1 id="title">DQTV Portal</h1>
      </div>
    </div>
    <p class="subtitle" id="subtitle">Bảng điều khiển trung tâm — chọn ứng dụng để truy cập</p>
    <div class="host-switcher" id="host-switcher"></div>
  </header>

  <div class="status-bar" id="status-bar"></div>

  <div class="grid" id="grid"></div>

  <footer>
    Mọi liên kết trỏ về <span id="portal-host"></span> — DNS trỏ tới IPv4 local (cập nhật tự động khi chạy run.command)<br />
    <span id="portal-url"></span>
  </footer>

  <script>
    const DEFAULT_CONFIG = {
      title: 'DQTV Portal',
      subtitle: 'Bảng điều khiển trung tâm — chọn ứng dụng để truy cập',
      protocol: 'http',
      targetHost: 'dqtt.dishow.net',
      accessHosts: ['dq.dishow.net', 'dqtt.dishow.net'],
      apps: [
        { id: 1, port: 8765, icon: '📋', title: 'Biên chế đơn vị', desc: 'Tra cứu và chỉnh sửa danh sách biên chế đơn vị từ file CSV. Hỗ trợ tìm kiếm nhanh, lọc và lưu tự động.' },
        { id: 2, port: 8888, icon: '🔍', title: 'Tuyển quân cơ sở', desc: 'Công cụ tìm kiếm danh sách tuyển quân theo khu vực, đọc dữ liệu trực tiếp từ các file Excel.' },
        { id: 3, port: 4173, icon: '⚙️', title: 'Quản lý tuyển quân', desc: 'Hệ thống quản lý tuyển quân toàn diện với cơ sở dữ liệu Supabase, báo cáo và xuất Excel.' },
        { id: 4, port: 8766, icon: '📄', title: 'Công cụ xử lý Word', desc: 'Gộp nhiều file .docx thành một. Tách file Word thành nhiều file theo cấu hình Excel.' },
        { id: 5, port: 8767, icon: '📊', title: 'Tối giản Excel', desc: 'Giảm kích thước file Excel, xoá format rác ngoài vùng dữ liệu, xoá Macro/VBA. Giữ nguyên dữ liệu và định dạng.' }
      ]
    };

    let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    let currentHost = CONFIG.targetHost;
    const IS_SECURE = window.location.protocol === 'https:';
    const ACCENTS = ['var(--accent1)', 'var(--accent2)', 'var(--accent3)', '#a78bfa', '#10b981'];

    function appUrl(app) {
      // Các dịch vụ local chạy HTTP thuần, luôn dùng http:// kể cả khi portal mở qua HTTPS.
      return `${CONFIG.protocol}://${currentHost}:${app.port}`;
    }

    function setHost(host) {
      currentHost = host;
      document.querySelectorAll('.host-pill').forEach(el => {
        el.classList.toggle('active', el.dataset.host === host);
      });
      document.getElementById('portal-host').textContent = host;
      document.getElementById('portal-url').textContent = `Điểm truy cập mọi ứng dụng: ${CONFIG.protocol}://${host}`;
      CONFIG.apps.forEach(app => {
        const card = document.getElementById(`card-${app.id}`);
        if (card) card.href = appUrl(app);
      });
      checkAll();
    }

    function renderHostSwitcher() {
      const wrap = document.getElementById('host-switcher');
      wrap.innerHTML = '';
      CONFIG.accessHosts.forEach(host => {
        const pill = document.createElement('div');
        pill.className = 'host-pill' + (host === currentHost ? ' active' : '');
        pill.dataset.host = host;
        pill.textContent = host;
        pill.addEventListener('click', () => setHost(host));
        wrap.appendChild(pill);
      });
    }

    function renderApps() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      CONFIG.apps.forEach((app, i) => {
        const card = document.createElement('a');
        card.className = `card card-${(i % 5) + 1}`;
        card.id = `card-${app.id}`;
        card.href = appUrl(app);
        card.target = '_blank';
        card.rel = 'noopener';
        card.innerHTML = `
          <div class="card-icon">${app.icon}</div>
          <div>
            <div class="card-title">${app.title}</div>
            <div class="card-desc">${app.desc}</div>
          </div>
          <div class="card-footer">
            <span class="port-badge">:${app.port}</span>
            <span class="arrow">→</span>
          </div>`;
        grid.appendChild(card);
      });
    }

    function renderStatusBar() {
      const bar = document.getElementById('status-bar');
      bar.innerHTML = '';
      const all = document.createElement('div');
      all.className = 'status-pill';
      all.innerHTML = '<span class="dot" id="dot-all"></span>Kiểm tra kết nối';
      all.addEventListener('click', checkAll);
      bar.appendChild(all);
      CONFIG.apps.forEach(app => {
        const pill = document.createElement('div');
        pill.className = 'status-pill';
        pill.innerHTML = `<span class="dot" id="dot-${app.id}"></span><span>${app.title}</span>`;
        bar.appendChild(pill);
      });
    }

    function render() {
      document.getElementById('title').textContent = CONFIG.title;
      document.getElementById('subtitle').textContent = CONFIG.subtitle;
      currentHost = CONFIG.targetHost || (CONFIG.accessHosts[0] ?? DEFAULT_CONFIG.targetHost);
      renderHostSwitcher();
      renderApps();
      renderStatusBar();
      setHost(currentHost);
    }

    async function loadConfig() {
      try {
        const res = await fetch('config.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          CONFIG = { ...DEFAULT_CONFIG, ...data };
          if (Array.isArray(data.apps)) CONFIG.apps = data.apps;
          if (Array.isArray(data.accessHosts) && data.accessHosts.length) CONFIG.accessHosts = data.accessHosts;
        }
      } catch {
        // Không có config.json → dùng mặc định
      }
      render();
    }

    async function checkPort(url) {
      if (IS_SECURE) {
        // Trang HTTPS không gọi được http service (mixed content bị chặn).
        // Bỏ qua kiểm tra thật — chỉ coi là online khi mở từ HTTPS.
        return true;
      }
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2500);
        await fetch(url, { mode: 'no-cors', signal: ctrl.signal });
        clearTimeout(timer);
        return true;
      } catch {
        return false;
      }
    }

    async function checkAll() {
      const dotAll = document.getElementById('dot-all');
      dotAll.className = 'dot loading';
      let allOk = true;

      for (const app of CONFIG.apps) {
        const dot = document.getElementById(`dot-${app.id}`);
        if (!dot) continue;
        dot.className = 'dot loading';
        const ok = await checkPort(appUrl(app));
        dot.className = 'dot ' + (ok ? 'online' : 'error');
        if (!ok) allOk = false;
      }

      dotAll.className = 'dot ' + (allOk ? 'online' : 'error');
    }

    window.addEventListener('load', loadConfig);
  </script>

</body>
</html>
